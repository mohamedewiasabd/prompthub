name: Flatpak (Flathub-ready)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: prompthub.flatpak
          manifest-path: packaging/flatpak/io.github.mohamedewiasabd.prompthub.yml
          artifact-name: prompthub-flatpak-x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          verbose: true