id: io.github.mohamedewiasabd.prompthub
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: prompthub

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-run/dconf
  - --talk-name=ca.desrt.dconf

modules:
  - name: prompthub
    buildsystem: simple
    build-commands:
      - install -Dm755 ./prompthub /app/bin/prompthub
      - install -Dm644 ./io.github.mohamedewiasabd.prompthub.desktop /app/share/applications/io.github.mohamedewiasabd.prompthub.desktop
      - install -Dm644 ./io.github.mohamedewiasabd.prompthub.metainfo.xml /app/share/metainfo/io.github.mohamedewiasabd.prompthub.metainfo.xml
      - install -Dm644 ./icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.mohamedewiasabd.prompthub.png
      - install -Dm644 ./icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.mohamedewiasabd.prompthub.png
      - install -Dm644 ./icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.mohamedewiasabd.prompthub.png
      - install -Dm644 ./icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.mohamedewiasabd.prompthub.png
    sources:
      - type: dir
        path: ../../flatpak-staging